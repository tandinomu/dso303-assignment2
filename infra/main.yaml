AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  DSO303 A2 - Online exam and assignment platform. Two-AZ VPC, CloudFront + WAF,
  Cognito, ALB + ECS Fargate API, Aurora PostgreSQL (2 AZs) + RDS Proxy, DynamoDB autosave,
  S3 assignments with lifecycle, SQS + Lambda async processing, SES email, CloudWatch,
  CloudTrail and AWS Backup. Deploy in ap-south-1.

Parameters:
  EnvName:
    Type: String
    Default: prod
    AllowedPattern: "[a-z0-9-]+"
  ApiImageUri:
    Type: String
    Description: Full ECR image URI for the API (set by the pipeline). The default is a placeholder that answers /health.
    Default: public.ecr.aws/docker/library/nginx:stable-alpine
  WebAclArn:
    Type: String
    Default: ""
    Description: ARN of the CLOUDFRONT-scoped WAF web ACL from infra/waf.yaml (us-east-1). Empty = no WAF.
  OriginVerifySecret:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: Random string CloudFront adds as X-Origin-Verify; the ALB rejects requests without it.
  CloudFrontPrefixListId:
    Type: String
    Default: pl-9aa247f3
    Description: Managed prefix list com.amazonaws.global.cloudfront.origin-facing for ap-south-1.
  SenderEmail:
    Type: String
    Default: noreply@example.edu
    Description: SES-verified sender address.
  AlarmEmail:
    Type: String
    Default: ops@example.edu
  TutorNotifyEmail:
    Type: String
    Default: tutors@example.edu
    Description: Address subscribed to the tutor-notifications SNS topic (e.g. a course tutors' mailing list).
  AppDomainOrigin:
    Type: String
    Default: "*"
    Description: Allowed CORS origin for direct S3 uploads, e.g. https://exams.example.edu

  HostedZoneId:
    Type: String
    Default: ""
    Description: Route 53 public hosted zone ID for the university domain. Empty = use the *.cloudfront.net URL.
  AppDomainName:
    Type: String
    Default: ""
    Description: e.g. exams.example.edu (needs HostedZoneId + CloudFrontCertificateArn)
  CloudFrontCertificateArn:
    Type: String
    Default: ""
    Description: ACM certificate for AppDomainName, issued in us-east-1
  OriginDomainName:
    Type: String
    Default: ""
    Description: e.g. origin.exams.example.edu - DNS name for the ALB so CloudFront can use HTTPS to the origin
  AlbCertificateArn:
    Type: String
    Default: ""
    Description: ACM certificate (this region) for OriginDomainName. Set together to encrypt CloudFront -> ALB.

Conditions:
  HasWaf: !Not [!Equals [!Ref WebAclArn, ""]]
  HasDomain: !And
    - !Not [!Equals [!Ref HostedZoneId, ""]]
    - !Not [!Equals [!Ref AppDomainName, ""]]
    - !Not [!Equals [!Ref CloudFrontCertificateArn, ""]]
  HasOriginTls: !And
    - !Not [!Equals [!Ref HostedZoneId, ""]]
    - !Not [!Equals [!Ref OriginDomainName, ""]]
    - !Not [!Equals [!Ref AlbCertificateArn, ""]]

Mappings:
  Net:
    Vpc: { Cidr: 10.0.0.0/16 }
    PublicA: { Cidr: 10.0.0.0/19 }
    PublicB: { Cidr: 10.0.32.0/19 }
    AppA: { Cidr: 10.0.64.0/19 }
    AppB: { Cidr: 10.0.96.0/19 }
    DataA: { Cidr: 10.0.128.0/19 }
    DataB: { Cidr: 10.0.160.0/19 }

Resources:
  # ------------------------------------------------------------------ encryption
  AppKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub exam-${EnvName} data key
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountAdmin
            Effect: Allow
            Principal: { AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root" }
            Action: "kms:*"
            Resource: "*"
          - Sid: AllowAwsServicesInAccount
            Effect: Allow
            Principal:
              Service:
                - logs.amazonaws.com
                - cloudtrail.amazonaws.com
                - events.amazonaws.com
                - sqs.amazonaws.com
            Action: [kms:Encrypt, kms:Decrypt, kms:ReEncrypt*, kms:GenerateDataKey*, kms:DescribeKey]
            Resource: "*"
  AppKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/exam-${EnvName}
      TargetKeyId: !Ref AppKey

  # ------------------------------------------------------------------ network
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !FindInMap [Net, Vpc, Cidr]
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub exam-${EnvName}-vpc
  Igw:
    Type: AWS::EC2::InternetGateway
  IgwAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: { VpcId: !Ref Vpc, InternetGatewayId: !Ref Igw }

  PublicA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !FindInMap [Net, PublicA, Cidr]
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags: [{ Key: Name, Value: public-a }]
  PublicB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !FindInMap [Net, PublicB, Cidr]
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags: [{ Key: Name, Value: public-b }]
  AppA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !FindInMap [Net, AppA, Cidr]
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags: [{ Key: Name, Value: private-app-a }]
  AppB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !FindInMap [Net, AppB, Cidr]
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags: [{ Key: Name, Value: private-app-b }]
  DataA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !FindInMap [Net, DataA, Cidr]
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags: [{ Key: Name, Value: private-data-a }]
  DataB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !FindInMap [Net, DataB, Cidr]
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags: [{ Key: Name, Value: private-data-b }]

  PublicRt:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  PublicDefault:
    Type: AWS::EC2::Route
    DependsOn: IgwAttach
    Properties: { RouteTableId: !Ref PublicRt, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref Igw }
  PublicAAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicA, RouteTableId: !Ref PublicRt }
  PublicBAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicB, RouteTableId: !Ref PublicRt }

  # One NAT per AZ so losing an AZ never cuts outbound traffic for the other
  NatEipA:
    Type: AWS::EC2::EIP
    Properties: { Domain: vpc }
  NatEipB:
    Type: AWS::EC2::EIP
    Properties: { Domain: vpc }
  NatA:
    Type: AWS::EC2::NatGateway
    Properties: { SubnetId: !Ref PublicA, AllocationId: !GetAtt NatEipA.AllocationId }
  NatB:
    Type: AWS::EC2::NatGateway
    Properties: { SubnetId: !Ref PublicB, AllocationId: !GetAtt NatEipB.AllocationId }

  PrivateRtA:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  PrivateRtB:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  PrivateDefaultA:
    Type: AWS::EC2::Route
    Properties: { RouteTableId: !Ref PrivateRtA, DestinationCidrBlock: 0.0.0.0/0, NatGatewayId: !Ref NatA }
  PrivateDefaultB:
    Type: AWS::EC2::Route
    Properties: { RouteTableId: !Ref PrivateRtB, DestinationCidrBlock: 0.0.0.0/0, NatGatewayId: !Ref NatB }
  AppAAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref AppA, RouteTableId: !Ref PrivateRtA }
  AppBAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref AppB, RouteTableId: !Ref PrivateRtB }
  # data subnets: local routes only (no internet path at all)
  DataRt:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  DataAAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref DataA, RouteTableId: !Ref DataRt }
  DataBAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref DataB, RouteTableId: !Ref DataRt }

  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref PrivateRtA, !Ref PrivateRtB]
  DynamoEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.dynamodb
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref PrivateRtA, !Ref PrivateRtB]

  FlowLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: { RetentionInDays: 90, KmsKeyId: !GetAtt AppKey.Arn }
  FlowLogRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: vpc-flow-logs.amazonaws.com }, Action: sts:AssumeRole }]
      Policies:
        - PolicyName: logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogStreams]
                Resource: !GetAtt FlowLogGroup.Arn
  FlowLog:
    Type: AWS::EC2::FlowLog
    Properties:
      ResourceId: !Ref Vpc
      ResourceType: VPC
      TrafficType: ALL
      LogGroupName: !Ref FlowLogGroup
      DeliverLogsPermissionArn: !GetAtt FlowLogRole.Arn

  # ------------------------------------------------------------------ security groups
  AlbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB - only from CloudFront origin-facing IPs
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !If [HasOriginTls, 443, 80]
          ToPort: !If [HasOriginTls, 443, 80]
          SourcePrefixListId: !Ref CloudFrontPrefixListId
  ApiSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: API tasks - only from ALB
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 8080, ToPort: 8080, SourceSecurityGroupId: !Ref AlbSg }
  ProxySg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS Proxy - only from API tasks
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref ApiSg }
  DbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Aurora - only from RDS Proxy
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref ProxySg }

  # ------------------------------------------------------------------ authentication
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub exam-${EnvName}-users
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      MfaConfiguration: OPTIONAL
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      AdminCreateUserConfig: { AllowAdminCreateUserOnly: true }
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: web-spa
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 1
      TokenValidityUnits: { AccessToken: minutes, IdToken: minutes, RefreshToken: days }
      PreventUserExistenceErrors: ENABLED
  StudentGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { UserPoolId: !Ref UserPool, GroupName: student, Precedence: 30 }
  TutorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { UserPoolId: !Ref UserPool, GroupName: tutor, Precedence: 20 }
  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { UserPoolId: !Ref UserPool, GroupName: admin, Precedence: 10 }

  # ------------------------------------------------------------------ database (Aurora across 2 AZs)
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: private data subnets in two AZs
      SubnetIds: [!Ref DataA, !Ref DataB]
  DbParams:
    Type: AWS::RDS::DBClusterParameterGroup
    Properties:
      Description: force TLS
      Family: aurora-postgresql16
      Parameters: { rds.force_ssl: "1" }
  DbCluster:
    Type: AWS::RDS::DBCluster
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: aurora-postgresql
      EngineVersion: "16.9"
      DatabaseName: exams
      MasterUsername: examadmin
      ManageMasterUserPassword: true
      MasterUserSecret: { KmsKeyId: !Ref AppKey }
      DBSubnetGroupName: !Ref DbSubnetGroup
      DBClusterParameterGroupName: !Ref DbParams
      VpcSecurityGroupIds: [!Ref DbSg]
      StorageEncrypted: true
      KmsKeyId: !Ref AppKey
      BackupRetentionPeriod: 35
      PreferredBackupWindow: "18:00-19:00"
      DeletionProtection: true
      EnableHttpEndpoint: true          # RDS Data API, used by Lambdas (no VPC attachment / connection storms)
      CopyTagsToSnapshot: true
      EnableCloudwatchLogsExports: [postgresql]
  DbWriter:
    Type: AWS::RDS::DBInstance
    Properties:
      DBClusterIdentifier: !Ref DbCluster
      Engine: aurora-postgresql
      DBInstanceClass: db.r6g.large
      AvailabilityZone: !Select [0, !GetAZs ""]
      PubliclyAccessible: false
      PromotionTier: 0
  DbReader:
    Type: AWS::RDS::DBInstance
    Properties:
      DBClusterIdentifier: !Ref DbCluster
      Engine: aurora-postgresql
      DBInstanceClass: db.r6g.large
      AvailabilityZone: !Select [1, !GetAZs ""]
      PubliclyAccessible: false
      PromotionTier: 0           # first in line for failover

  DbProxyRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: rds.amazonaws.com }, Action: sts:AssumeRole }]
      Policies:
        - PolicyName: read-db-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !GetAtt DbCluster.MasterUserSecret.SecretArn
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !GetAtt AppKey.Arn
  DbProxy:
    Type: AWS::RDS::DBProxy
    Properties:
      DBProxyName: !Sub exam-${EnvName}-proxy
      EngineFamily: POSTGRESQL
      RequireTLS: true
      RoleArn: !GetAtt DbProxyRole.Arn
      VpcSubnetIds: [!Ref DataA, !Ref DataB]
      VpcSecurityGroupIds: [!Ref ProxySg]
      Auth:
        - AuthScheme: SECRETS
          SecretArn: !GetAtt DbCluster.MasterUserSecret.SecretArn
          IAMAuth: DISABLED
  DbProxyTargets:
    Type: AWS::RDS::DBProxyTargetGroup
    DependsOn: [DbWriter, DbReader]
    Properties:
      DBProxyName: !Ref DbProxy
      TargetGroupName: default
      DBClusterIdentifiers: [!Ref DbCluster]

  # ------------------------------------------------------------------ autosave store
  AttemptsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub exam-${EnvName}-attempts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: attemptId, AttributeType: S }]
      KeySchema: [{ AttributeName: attemptId, KeyType: HASH }]
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      SSESpecification: { SSEEnabled: true, SSEType: KMS, KMSMasterKeyId: !Ref AppKey }
      TimeToLiveSpecification: { AttributeName: expiresAt, Enabled: true }
      DeletionProtectionEnabled: true

  # ------------------------------------------------------------------ file storage
  AssignmentsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub exam-${EnvName}-assignments-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
      VersioningConfiguration: { Status: Enabled }
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: aws:kms, KMSMasterKeyID: !Ref AppKey }
            BucketKeyEnabled: true
      NotificationConfiguration:
        EventBridgeConfiguration: { EventBridgeEnabled: true }
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT, GET]
            AllowedOrigins: [!Ref AppDomainOrigin]
            AllowedHeaders: ["*"]
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: retain-5-years
            Status: Enabled
            Transitions:
              - { StorageClass: STANDARD_IA, TransitionInDays: 90 }
              - { StorageClass: GLACIER, TransitionInDays: 365 }
            ExpirationInDays: 1825
            NoncurrentVersionExpiration: { NoncurrentDays: 30 }
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 7 }
  AssignmentsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AssignmentsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt AssignmentsBucket.Arn, !Sub "${AssignmentsBucket.Arn}/*"]
            Condition: { Bool: { aws:SecureTransport: "false" } }

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub exam-${EnvName}-web-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      VersioningConfiguration: { Status: Enabled }
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }]
  FrontendOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub exam-${EnvName}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFrontReadOnly
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  # ------------------------------------------------------------------ load balancer
  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Subnets: [!Ref PublicA, !Ref PublicB]
      SecurityGroups: [!Ref AlbSg]
      LoadBalancerAttributes:
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: "true" }
        - { Key: idle_timeout.timeout_seconds, Value: "60" }
  ApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }
  AlbListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: !If [HasOriginTls, 443, 80]
      Protocol: !If [HasOriginTls, HTTPS, HTTP]
      SslPolicy: !If [HasOriginTls, ELBSecurityPolicy-TLS13-1-2-2021-06, !Ref AWS::NoValue]
      Certificates: !If [HasOriginTls, [{ CertificateArn: !Ref AlbCertificateArn }], !Ref AWS::NoValue]
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig: { StatusCode: "403", ContentType: text/plain, MessageBody: Forbidden }
  AlbFromCloudFrontOnly:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref AlbListener
      Priority: 1
      Conditions:
        - Field: http-header
          HttpHeaderConfig: { HttpHeaderName: X-Origin-Verify, Values: [!Ref OriginVerifySecret] }
      Actions: [{ Type: forward, TargetGroupArn: !Ref ApiTargetGroup }]

  # ------------------------------------------------------------------ CDN
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub exam-${EnvName}
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        DefaultRootObject: index.html
        WebACLId: !If [HasWaf, !Ref WebAclArn, !Ref AWS::NoValue]
        Aliases: !If [HasDomain, [!Ref AppDomainName], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - HasDomain
          - { AcmCertificateArn: !Ref CloudFrontCertificateArn, SslSupportMethod: sni-only, MinimumProtocolVersion: TLSv1.2_2021 }
          - { CloudFrontDefaultCertificate: true }
        Origins:
          - Id: web
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOac.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
          - Id: api
            DomainName: !If [HasOriginTls, !Ref OriginDomainName, !GetAtt Alb.DNSName]
            CustomOriginConfig:
              OriginProtocolPolicy: !If [HasOriginTls, https-only, http-only]
              OriginSSLProtocols: [TLSv1.2]
            OriginCustomHeaders: [{ HeaderName: X-Origin-Verify, HeaderValue: !Ref OriginVerifySecret }]
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6          # Managed-CachingOptimized
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad        # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
        CustomErrorResponses:
          - { ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html }

  AppDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref AppDomainName
      Type: A
      AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }  # CloudFront zone
  OriginDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasOriginTls
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref OriginDomainName
      Type: A
      AliasTarget: { DNSName: !GetAtt Alb.DNSName, HostedZoneId: !GetAtt Alb.CanonicalHostedZoneID }

  # ------------------------------------------------------------------ async: queues
  MarkingDlq:
    Type: AWS::SQS::Queue
    Properties: { MessageRetentionPeriod: 1209600, KmsMasterKeyId: !Ref AppKey }
  MarkingQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 360
      KmsMasterKeyId: !Ref AppKey
      RedrivePolicy: { deadLetterTargetArn: !GetAtt MarkingDlq.Arn, maxReceiveCount: 3 }
  NotifyDlq:
    Type: AWS::SQS::Queue
    Properties: { MessageRetentionPeriod: 1209600, KmsMasterKeyId: !Ref AppKey }
  NotifyQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 180
      KmsMasterKeyId: !Ref AppKey
      RedrivePolicy: { deadLetterTargetArn: !GetAtt NotifyDlq.Arn, maxReceiveCount: 3 }
  UploadEventsDlq:
    Type: AWS::SQS::Queue
    Properties: { MessageRetentionPeriod: 1209600, KmsMasterKeyId: !Ref AppKey }

  TutorTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub exam-${EnvName}-tutor-notifications
      KmsMasterKeyId: !Ref AppKey
      Subscription: [{ Protocol: email, Endpoint: !Ref TutorNotifyEmail }]

  # ------------------------------------------------------------------ async: lambdas
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole]
      Policies:
        - PolicyName: app-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes, sqs:SendMessage]
                Resource: [!GetAtt MarkingQueue.Arn, !GetAtt NotifyQueue.Arn]
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:UpdateItem]
                Resource: !GetAtt AttemptsTable.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectAttributes]
                Resource: !Sub "${AssignmentsBucket.Arn}/*"
              - Effect: Allow
                Action: [rds-data:ExecuteStatement]
                Resource: !GetAtt DbCluster.DBClusterArn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !GetAtt DbCluster.MasterUserSecret.SecretArn
              - Effect: Allow
                Action: [kms:Decrypt, kms:GenerateDataKey]
                Resource: !GetAtt AppKey.Arn
              - Effect: Allow
                Action: [ses:SendEmail]
                Resource: "*"
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref TutorTopic

  MarkFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Auto-marks MCQ answers of a submitted attempt
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: 60
      MemorySize: 512
      ReservedConcurrentExecutions: 50
      Environment:
        Variables: { TABLE: !Ref AttemptsTable, NOTIFY_QUEUE: !Ref NotifyQueue }
      Code:
        ZipFile: |
          import json, os, boto3
          ddb = boto3.resource("dynamodb").Table(os.environ["TABLE"])
          def handler(event, context):
              failures = []
              for rec in event["Records"]:
                  try:
                      attempt_id = json.loads(rec["body"])["attemptId"]
                      item = ddb.get_item(Key={"attemptId": attempt_id})["Item"]
                      key = item.get("answerKey", {})          # MCQ key copied at exam start
                      answers = item.get("answers", {})
                      score = sum(1 for q, a in key.items() if answers.get(q) == a)
                      ddb.update_item(Key={"attemptId": attempt_id},
                          UpdateExpression="SET mcqScore=:s, #st=:m",
                          ExpressionAttributeNames={"#st": "status"},
                          ExpressionAttributeValues={":s": score, ":m": "MARKED_MCQ"})
                      print(json.dumps({"attemptId": attempt_id, "mcqScore": score}))
                  except Exception as exc:
                      print("failed", rec["messageId"], exc)
                      failures.append({"itemIdentifier": rec["messageId"]})
              return {"batchItemFailures": failures}
  MarkMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt MarkingQueue.Arn
      FunctionName: !Ref MarkFunction
      BatchSize: 10
      FunctionResponseTypes: [ReportBatchItemFailures]

  UploadFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Validates an uploaded assignment, records it, publishes the tutor notification to SNS
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          TUTOR_TOPIC: !Ref TutorTopic
          DB_ARN: !GetAtt DbCluster.DBClusterArn
          DB_SECRET: !GetAtt DbCluster.MasterUserSecret.SecretArn
      Code:
        ZipFile: |
          import json, os, boto3
          s3 = boto3.client("s3"); sns = boto3.client("sns"); rds = boto3.client("rds-data")
          MAX = 50 * 1024 * 1024
          def handler(event, context):
              d = event["detail"]; bucket = d["bucket"]["name"]; key = d["object"]["key"]
              head = s3.head_object(Bucket=bucket, Key=key)
              ok = head["ContentLength"] <= MAX and key.lower().endswith((".pdf", ".zip"))
              # key format: submissions/<assignmentId>/<studentId>/<file>
              _, assignment_id, student_id, _ = key.split("/", 3)
              rds.execute_statement(resourceArn=os.environ["DB_ARN"], secretArn=os.environ["DB_SECRET"],
                  database="exams",
                  sql="INSERT INTO submissions(assignment_id, student_id, s3_key, version_id, bytes, valid) "
                      "VALUES(:a, :s, :k, :v, :b, :ok)",
                  parameters=[{"name": "a", "value": {"stringValue": assignment_id}},
                              {"name": "s", "value": {"stringValue": student_id}},
                              {"name": "k", "value": {"stringValue": key}},
                              {"name": "v", "value": {"stringValue": head.get("VersionId", "")}},
                              {"name": "b", "value": {"longValue": head["ContentLength"]}},
                              {"name": "ok", "value": {"booleanValue": ok}}])
              sns.publish(TopicArn=os.environ["TUTOR_TOPIC"],
                  Subject=f"New submission for assignment {assignment_id}",
                  Message=f"Student {student_id} uploaded {key.rsplit('/', 1)[-1]} "
                          f"({head['ContentLength'] // (1024 * 1024)} MB, valid={ok}).",
                  MessageAttributes={"assignmentId": {"DataType": "String", "StringValue": assignment_id}})
              return {"recorded": key, "valid": ok}
  UploadRule:
    Type: AWS::Events::Rule
    Properties:
      Description: New assignment file uploaded
      EventPattern:
        source: [aws.s3]
        detail-type: [Object Created]
        detail:
          bucket: { name: [!Ref AssignmentsBucket] }
          object: { key: [{ prefix: submissions/ }] }
      Targets:
        - Id: upload-processor
          Arn: !GetAtt UploadFunction.Arn
          RetryPolicy: { MaximumRetryAttempts: 185, MaximumEventAgeInSeconds: 86400 }
          DeadLetterConfig: { Arn: !GetAtt UploadEventsDlq.Arn }
  UploadInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UploadFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt UploadRule.Arn
  UploadEventsDlqPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref UploadEventsDlq]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt UploadEventsDlq.Arn
            Condition: { ArnEquals: { aws:SourceArn: !GetAtt UploadRule.Arn } }

  NotifyFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Sends "results released" emails to students through SES
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          SENDER: !Ref SenderEmail
      Code:
        ZipFile: |
          import json, os, boto3
          ses = boto3.client("sesv2")
          def handler(event, context):
              failures = []
              for rec in event["Records"]:
                  try:
                      m = json.loads(rec["body"])
                      to, subject = m["email"], "Your exam results are available"   # RESULTS_RELEASED
                      body = "Sign in to the exam platform to see your results."
                      ses.send_email(FromEmailAddress=os.environ["SENDER"],
                          Destination={"ToAddresses": [to]},
                          Content={"Simple": {"Subject": {"Data": subject}, "Body": {"Text": {"Data": body}}}})
                  except Exception as exc:
                      print("failed", rec["messageId"], exc)
                      failures.append({"itemIdentifier": rec["messageId"]})
              return {"batchItemFailures": failures}
  NotifyMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt NotifyQueue.Arn
      FunctionName: !Ref NotifyFunction
      BatchSize: 10
      FunctionResponseTypes: [ReportBatchItemFailures]

  # ------------------------------------------------------------------ compute: ECS Fargate API
  EcrRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub exam-${EnvName}-api
      ImageScanningConfiguration: { ScanOnPush: true }
      ImageTagMutability: IMMUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"keep last 20","selection":{"tagStatus":"any",
          "countType":"imageCountMoreThan","countNumber":20},"action":{"type":"expire"}}]}
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterSettings: [{ Name: containerInsights, Value: enabled }]
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: { RetentionInDays: 90 }
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: sts:AssumeRole }]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy]
      Policies:
        - PolicyName: read-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !GetAtt DbCluster.MasterUserSecret.SecretArn
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !GetAtt AppKey.Arn
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: sts:AssumeRole }]
      Policies:
        - PolicyName: api-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
                Resource: !GetAtt AttemptsTable.Arn
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject]          # used only to sign presigned URLs
                Resource: !Sub "${AssignmentsBucket.Arn}/*"
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: [!GetAtt MarkingQueue.Arn, !GetAtt NotifyQueue.Arn]
              - Effect: Allow
                Action: [kms:Decrypt, kms:GenerateDataKey]
                Resource: !GetAtt AppKey.Arn
  TaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub exam-${EnvName}-api
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      RuntimePlatform: { CpuArchitecture: X86_64, OperatingSystemFamily: LINUX }
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: api
          Image: !Ref ApiImageUri
          PortMappings: [{ ContainerPort: 8080 }]
          Essential: true
          Environment:
            - { Name: PORT, Value: "8080" }
            - { Name: AWS_REGION, Value: !Ref AWS::Region }
            - { Name: TABLE, Value: !Ref AttemptsTable }
            - { Name: BUCKET, Value: !Ref AssignmentsBucket }
            - { Name: MARKING_QUEUE, Value: !Ref MarkingQueue }
            - { Name: NOTIFY_QUEUE, Value: !Ref NotifyQueue }
            - { Name: USER_POOL_ID, Value: !Ref UserPool }
            - { Name: USER_POOL_CLIENT_ID, Value: !Ref UserPoolClient }
            - { Name: DB_HOST, Value: !GetAtt DbProxy.Endpoint }
            - { Name: DB_NAME, Value: exams }
          Secrets:
            - { Name: DB_SECRET, ValueFrom: !GetAtt DbCluster.MasterUserSecret.SecretArn }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApiLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api
  ApiService:
    Type: AWS::ECS::Service
    DependsOn: AlbFromCloudFrontOnly
    Properties:
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDef
      LaunchType: FARGATE
      DesiredCount: 4
      HealthCheckGracePeriodSeconds: 30
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: [!Ref AppA, !Ref AppB]
          SecurityGroups: [!Ref ApiSg]
      LoadBalancers: [{ ContainerName: api, ContainerPort: 8080, TargetGroupArn: !Ref ApiTargetGroup }]

  ApiScaling:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub service/${Cluster}/${ApiService.Name}
      MinCapacity: 4
      MaxCapacity: 30
      ScheduledActions:
        # Example exam-week schedule (UTC): pre-warm to 12 tasks (6 per AZ) at 02:30, back to 4 at 12:00
        - ScheduledActionName: exam-prewarm
          Schedule: cron(30 2 ? * MON-FRI *)
          ScalableTargetAction: { MinCapacity: 12, MaxCapacity: 30 }
        - ScheduledActionName: exam-cooldown
          Schedule: cron(0 12 ? * MON-FRI *)
          ScalableTargetAction: { MinCapacity: 4, MaxCapacity: 30 }
  ApiCpuPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: cpu60
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ApiScaling
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 60
        PredefinedMetricSpecification: { PredefinedMetricType: ECSServiceAverageCPUUtilization }
        ScaleOutCooldown: 60
        ScaleInCooldown: 300
  ApiRequestPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: requests-per-target
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ApiScaling
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 500
        PredefinedMetricSpecification:
          PredefinedMetricType: ALBRequestCountPerTarget
          ResourceLabel: !Sub "${Alb.LoadBalancerFullName}/${ApiTargetGroup.TargetGroupFullName}"
        ScaleOutCooldown: 60
        ScaleInCooldown: 300

  # ------------------------------------------------------------------ monitoring
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      KmsMasterKeyId: alias/aws/sns
      Subscription: [{ Protocol: email, Endpoint: !Ref AlarmEmail }]
  Alb5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: API 5xx errors during exams
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions: [{ Name: LoadBalancer, Value: !GetAtt Alb.LoadBalancerFullName }]
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 20
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
  LatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: p95 API latency above 1 s
      Namespace: AWS/ApplicationELB
      MetricName: TargetResponseTime
      Dimensions: [{ Name: LoadBalancer, Value: !GetAtt Alb.LoadBalancerFullName }]
      ExtendedStatistic: p95
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
  UnhealthyHostsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Targets unhealthy (possible AZ problem)
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - { Name: LoadBalancer, Value: !GetAtt Alb.LoadBalancerFullName }
        - { Name: TargetGroup, Value: !GetAtt ApiTargetGroup.TargetGroupFullName }
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!Ref AlarmTopic]
  DbCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Aurora CPU above 75%
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions: [{ Name: DBClusterIdentifier, Value: !Ref DbCluster }]
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 75
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!Ref AlarmTopic]
  MarkingDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Marking jobs failing
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !GetAtt MarkingDlq.QueueName }]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!Ref AlarmTopic]
  NotifyDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Emails failing
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !GetAtt NotifyDlq.QueueName }]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!Ref AlarmTopic]
  ExamDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub exam-${EnvName}
      DashboardBody: !Sub |
        {"widgets":[
          {"type":"metric","width":12,"height":6,"properties":{"title":"API requests and 5xx","region":"${AWS::Region}",
            "metrics":[["AWS/ApplicationELB","RequestCount","LoadBalancer","${Alb.LoadBalancerFullName}",{"stat":"Sum"}],
                       [".","HTTPCode_Target_5XX_Count",".",".",{"stat":"Sum"}]]}},
          {"type":"metric","width":12,"height":6,"properties":{"title":"p95 latency","region":"${AWS::Region}",
            "metrics":[["AWS/ApplicationELB","TargetResponseTime","LoadBalancer","${Alb.LoadBalancerFullName}",{"stat":"p95"}]]}},
          {"type":"metric","width":12,"height":6,"properties":{"title":"Autosave writes","region":"${AWS::Region}",
            "metrics":[["AWS/DynamoDB","ConsumedWriteCapacityUnits","TableName","${AttemptsTable}",{"stat":"Sum"}]]}},
          {"type":"metric","width":12,"height":6,"properties":{"title":"Queues","region":"${AWS::Region}",
            "metrics":[["AWS/SQS","ApproximateNumberOfMessagesVisible","QueueName","${MarkingQueue.QueueName}"],
                       ["...","${NotifyQueue.QueueName}"]]}}]}

  # ------------------------------------------------------------------ audit
  TrailBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub exam-${EnvName}-trail-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }]
      LifecycleConfiguration:
        Rules:
          - Id: keep-5-years
            Status: Enabled
            Transitions: [{ StorageClass: GLACIER, TransitionInDays: 90 }]
            ExpirationInDays: 1825
  TrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TrailBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudtrail.amazonaws.com }
            Action: s3:GetBucketAcl
            Resource: !GetAtt TrailBucket.Arn
          - Effect: Allow
            Principal: { Service: cloudtrail.amazonaws.com }
            Action: s3:PutObject
            Resource: !Sub "${TrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*"
            Condition: { StringEquals: { s3:x-amz-acl: bucket-owner-full-control } }
  Trail:
    Type: AWS::CloudTrail::Trail
    DependsOn: TrailBucketPolicy
    Properties:
      IsLogging: true
      IsMultiRegionTrail: true
      IncludeGlobalServiceEvents: true
      EnableLogFileValidation: true
      S3BucketName: !Ref TrailBucket

  # ------------------------------------------------------------------ backup (5-year retention)
  BackupVault:
    Type: AWS::Backup::BackupVault
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BackupVaultName: !Sub exam-${EnvName}-vault
      EncryptionKeyArn: !GetAtt AppKey.Arn
  BackupPlan:
    Type: AWS::Backup::BackupPlan
    Properties:
      BackupPlan:
        BackupPlanName: !Sub exam-${EnvName}-plan
        BackupPlanRule:
          - RuleName: daily-35d
            TargetBackupVault: !Ref BackupVault
            ScheduleExpression: cron(0 19 * * ? *)
            Lifecycle: { DeleteAfterDays: 35 }
          - RuleName: monthly-5y
            TargetBackupVault: !Ref BackupVault
            ScheduleExpression: cron(0 20 1 * ? *)
            Lifecycle: { MoveToColdStorageAfterDays: 30, DeleteAfterDays: 1825 }
  BackupRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: backup.amazonaws.com }, Action: sts:AssumeRole }]
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForBackup
        - arn:aws:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForRestores
  BackupSelection:
    Type: AWS::Backup::BackupSelection
    Properties:
      BackupPlanId: !Ref BackupPlan
      BackupSelection:
        SelectionName: exam-data
        IamRoleArn: !GetAtt BackupRole.Arn
        Resources:
          - !Sub "arn:aws:rds:${AWS::Region}:${AWS::AccountId}:cluster:${DbCluster}"
          - !GetAtt AttemptsTable.Arn

Outputs:
  AppUrl:
    Value: !If [HasDomain, !Sub "https://${AppDomainName}", !Sub "https://${Distribution.DomainName}"]
  DistributionId:
    Value: !Ref Distribution
  FrontendBucketName:
    Value: !Ref FrontendBucket
  AssignmentsBucketName:
    Value: !Ref AssignmentsBucket
  EcrRepositoryUri:
    Value: !GetAtt EcrRepo.RepositoryUri
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  TutorTopicArn:
    Value: !Ref TutorTopic
  DbProxyEndpoint:
    Value: !GetAtt DbProxy.Endpoint
