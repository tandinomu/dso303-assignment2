AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  CLOUDFRONT-scoped WAF web ACL for the exam platform. MUST be deployed in us-east-1
  (CloudFront only accepts web ACLs from that region). Pass the WebAclArn output to infra/main.yaml.

Parameters:
  EnvName:
    Type: String
    Default: prod

Resources:
  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub exam-${EnvName}-edge
      Scope: CLOUDFRONT
      DefaultAction: { Allow: {} }
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub exam-${EnvName}-edge
      Rules:
        - Name: rate-limit-per-ip
          Priority: 0
          Action: { Block: {} }
          Statement:
            RateBasedStatement: { Limit: 2000, AggregateKeyType: IP }
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: rate-limit }
        - Name: aws-common
          Priority: 1
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
              ExcludedRules:
                - Name: SizeRestrictions_BODY      # autosave bodies can exceed 8 KB
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: common }
        - Name: aws-bad-inputs
          Priority: 2
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement: { VendorName: AWS, Name: AWSManagedRulesKnownBadInputsRuleSet }
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: bad-inputs }
        - Name: aws-ip-reputation
          Priority: 3
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement: { VendorName: AWS, Name: AWSManagedRulesAmazonIpReputationList }
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: ip-rep }

Outputs:
  WebAclArn:
    Value: !GetAtt WebAcl.Arn
